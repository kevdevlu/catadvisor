name: catadvisor
type: laravel
docroot: public
php_version: "8.4"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
    type: postgres
    version: "17"
use_dns_when_possible: true
composer_version: "2"
web_environment: []
nodejs_version: "24"
corepack_enable: false

# Expose the Vite dev server (`ddev npm run dev`) at https://catadvisor.ddev.site:5173.
web_extra_exposed_ports:
  - name: vite
    container_port: 5173
    http_port: 5172
    https_port: 5173

# Create the Postgres database the PHPUnit tests use (see phpunit.xml), so
# tests never touch the demo data in the main "db" database.
hooks:
  post-start:
    - exec: psql -h db -U db -d db -tAc "SELECT 1 FROM pg_database WHERE datname = 'testing'" | grep -q 1 || psql -h db -U db -d db -c "CREATE DATABASE testing"
